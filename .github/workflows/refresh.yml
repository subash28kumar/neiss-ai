# Refreshes the website when CPSC publishes a new year of NEISS data.
# Runs on the 1st of every month (and on demand from the Actions tab).
name: Refresh NEISS data

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
    inputs:
      years:
        description: "Years to include (e.g. 2019-2026)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NEISS-AI
        run: pip install -e .
      - name: Work out which years to try
        id: yrs
        run: |
          if [ -n "${{ github.event.inputs.years }}" ]; then
            echo "years=${{ github.event.inputs.years }}" >> "$GITHUB_OUTPUT"
          else
            echo "years=2019-$(date +%Y)" >> "$GITHUB_OUTPUT"
          fi
      - name: Download NEISS files and rebuild site data
        run: python scripts/update_site.py --data-dir data --years "${{ steps.yrs.outputs.years }}" --download
      - name: Commit updated site (only if data changed)
        run: |
          git config user.name "neissai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No change in data."
          else
            git commit -m "Refresh NEISS data ($(date +%Y-%m-%d))"
            git push
          fi

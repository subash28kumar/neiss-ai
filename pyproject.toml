[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neissai"
version = "1.4.0"
description = "AI-assisted national injury estimates from NEISS emergency department narratives: consistent e-bike and e-scooter counts across product-code changes, with survey-correct confidence intervals."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Subash Kumar"}]
keywords = ["NEISS", "injury surveillance", "e-bike", "e-scooter", "micromobility", "text classification", "survey statistics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["pandas>=1.5", "numpy>=1.22"]

[project.optional-dependencies]
train = ["scikit-learn>=1.1"]
excel = ["openpyxl"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/subash28kumar/neiss-ai"
Dashboard = "https://subash28kumar.github.io/neiss-ai/"
Documentation = "https://github.com/subash28kumar/neiss-ai#readme"
Changelog = "https://github.com/subash28kumar/neiss-ai/blob/main/CHANGELOG.md"

[project.scripts]
neissai = "neissai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neissai = ["model/*.json"]
